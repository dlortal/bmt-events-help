name = "bmt-events-help"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Keep variables set in the Cloudflare dashboard (FEEDBACK_TO, FEEDBACK_FROM) when deploying.
keep_vars = true

# Worker logs: "Was this article helpful?" votes are logged here (docs/FEEDBACK.md).
[observability]
enabled = true

# Static site on Cloudflare Workers Static Assets. The Worker runs first only for "/" (old WordPress
# "?p=ID" links) and /api/* (article feedback); every other request is served from the assets.
# _headers and _redirects in public/ are honoured by the assets layer.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/", "/api/*"]

# Article feedback: at most 10 posts a minute per visitor IP (per Cloudflare location).
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "4212"

  [ratelimits.simple]
  limit = 10
  period = 60

# Feedback comments by email (docs/FEEDBACK.md). Uncomment once the sending domain is onboarded to
# Cloudflare Email Service in this account; deploying with it before then can fail.
# [[send_email]]
# name = "EMAIL"

# Custom domain is attached once DNS for bmt.bafta.org is in this Cloudflare account:
# [[routes]]
# pattern = "events-help.bmt.bafta.org"
# custom_domain = true
